# Builds the plugin and runs the test project on every push and pull request, and on request. There is
# no repository guard: this runs in the private development repository and the public one alike. The
# runner sets CI=true, so the plugin's post-build copy into N.I.N.A.'s folder is skipped.
name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run the tests
        run: |
          dotnet test tests/Astraeus.Tests/Astraeus.Tests.csproj --logger trx --results-directory TestResults
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
